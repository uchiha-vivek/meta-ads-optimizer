# ---------------------------------------------------------------------------
# Alembic configuration.
#
# Note what is NOT here: sqlalchemy.url. The connection string is read from the
# environment by migrations/env.py, because putting it here would mean either
# committing a database password or maintaining a second, drifting source of
# truth alongside DATABASE_URL.
#
#   docker compose run --rm app alembic upgrade head
#   docker compose run --rm app alembic revision --autogenerate -m "message"
# ---------------------------------------------------------------------------

[alembic]
script_location = migrations

# Revision filenames are prefixed with UTC generation time so that `ls` sorts
# them in creation order. The revision graph, not the filename, still determines
# execution order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Makes `app` importable when Alembic runs from the repository root.
prepend_sys_path = .

# Timestamps in filenames are UTC, so they remain comparable across contributors
# in different timezones.
timezone = UTC

# `os` means os.pathsep, which keeps multiple version paths portable.
version_path_separator = os

[post_write_hooks]
# Autogenerated migrations are formatted like the rest of the codebase, so a
# generated file never shows up as a formatting diff in review.
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = REVISION_SCRIPT_FILENAME

# ---------------------------------------------------------------------------
# Logging
#
# Alembic configures logging through this file when run as a CLI. The
# application's own logging setup is untouched by it.
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
